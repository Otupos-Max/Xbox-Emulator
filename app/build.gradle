plugins {
    id "com.android.application"
}

android {
    namespace "com.xboxemulator"
    compileSdk 35
    ndkVersion "26.3.11579264"

    sourceSets {
        main {
            assets.srcDirs += "${rootProject.projectDir}/Interface/Splash"
        }
    }

    androidResources {
        noCompress += "mp4"
    }

    defaultConfig {
        applicationId "com.xboxemulator"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DXBOXEMU_BUILD_TESTS=OFF"
            }
        }
    }

    flavorDimensions "device"
    productFlavors {
        mobile {
            dimension "device"
            ndk {
                abiFilters "arm64-v8a"
            }
        }
        tv {
            dimension "device"
            ndk {
                abiFilters "armeabi-v7a"
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def productName = variant.flavorName == "tv"
                ? "TV"
                : variant.flavorName.capitalize()
            outputFileName = "Xenon-${productName}.apk"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // Chave fixa salva no repositório: todo APK sai com a mesma assinatura,
    // então dá para atualizar o app sem desinstalar.
    // Chave de desenvolvimento: não use para publicar na Play Store.
    signingConfigs {
        debug {
            storeFile rootProject.file("keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            // Keep local release installs compatible with debug installs.
            // This development key must not be used to publish the app.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
        }
    }
}
