plugins {
    id "com.android.application"
}

android {
    namespace "com.xboxemulator"
    compileSdk 35
    ndkVersion "26.3.11579264"

    sourceSets {
        main {
            assets.srcDirs += "${rootProject.projectDir}/Interface/Splash"
        }
    }

    androidResources {
        noCompress += "mp4"
    }

    defaultConfig {
        applicationId "com.xboxemulator"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DXBOXEMU_BUILD_TESTS=OFF"
            }
        }
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Keep local release installs compatible with debug installs.
            // This development key must not be used to publish the app.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
        }
    }
}
